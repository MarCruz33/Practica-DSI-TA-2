<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turismo Aventura - Login</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <!-- Logo -->
            <img src="img/logo.png" alt="Logo" class="login-logo">

            <h2>Iniciar Sesión</h2>
            <p class="login-subtitle">Accede con tu correo institucional</p>

            <!-- Formulario de login -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@alumnos.utsv.edu.mx" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
                <div id="loginError" class="error-message"></div>
            </form>

            <!-- Botón para regresar al inicio -->
            <div class="btn-volver-container login-volver">
                <a href="index.html" class="btn-volver">← Volver al Inicio</a>
            </div>

            <!-- Información de ayuda (opcional) -->
            <div class="login-ayuda">
                <p>📧 Usuarios autorizados:</p>
                <small>dsm23190341.jsotelo@alumnos.utsv.edu.mx</small>
                <small>dsm22190090.jlopez@alumnos.ustv.edu.mx</small>
                <small>dsm22190295.mvazquez@alumnos.utsv.mx</small>
                <small>dsm22190367.ajimenez@alumnos.utsv.edu.mx</small>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
